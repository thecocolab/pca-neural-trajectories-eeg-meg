[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pca-neural-trajectories"
version = "0.1.0"
description = "Tutorial for A Primer on Low-Dimensional Neural Dynamics: PCA-Based Trajectory Analysis for EEG and MEG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "coco-pipe @ git+https://github.com/BabaSanfour/coco-pipe.git@viz",
    "jupyterlab",
    "ipywidgets",
    "mne"
    "mne-icalabel"
]

[tool.setuptools]
py-modules = ["run_tutorial"]
